name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Lint
        run: uvx ruff@latest check .

      - name: Type check
        run: uvx ty check src/

      - name: Test
        run: uv run pytest -v --tb=short
